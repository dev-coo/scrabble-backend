# ─────────────────────────────────────────────────────────────
# 웹소켓 명세 (AsyncAPI 3.0)
#
# 이 파일이 웹소켓 계약의 "원본"입니다.
#   - 사람이 읽는 설명  → docs/ws-contract.md
#   - 기계가 읽는 계약  → 이 파일          ← openapi.json 과 같은 자리
#   - 눈으로 보는 화면  → http://localhost:11000/ws-docs
#
# HTTP API 는 FastAPI 가 openapi.json 을 자동으로 만들어 주지만,
# 웹소켓은 그런 게 없어서 이 파일을 손으로 씁니다.
#
# ⚠️ 웹소켓을 고치면 이 파일도 함께 고쳐야 합니다.
#    코드와 자동으로 연결돼 있지 않아서, 안 고치면 조용히 거짓말하는
#    문서가 됩니다. /ws-docs 화면은 이 파일을 그대로 읽어 그립니다.
# ─────────────────────────────────────────────────────────────
asyncapi: 3.0.0

info:
  title: 스크래블 웹소켓
  version: 0.1.0
  description: |
    실시간 통로입니다. HTTP API 와 달리 **연결이 계속 이어져 있어서
    백엔드가 먼저 말을 걸 수 있습니다.**

    만나는 방법이 **두 가지** 있습니다.

    - **아는 사람과** — 방장이 `/ws/rooms` 로 방을 만들어 초대 코드를 받고,
      친구가 `/ws/rooms/{code}` 로 그 코드를 치고 들어옵니다.
    - **모르는 사람과** — 둘 다 `/ws/match` 에 접속하면 서버가 짝지어 줍니다.
      먼저 기다린 사람이 먼저 짝을 만납니다. (선착순)

    **어떻게 만났든 그 뒤는 완전히 같습니다.** 같은 방, 같은 채팅을 씁니다.

    `/ws` 는 연결이 되는지 확인만 하는 통로입니다. (실제 기능 아님)

    채팅은 **1:1** 입니다.

    자리가 하나뿐이라 세 번째 사람은 들어올 수 없습니다.

    두 사람이 모이면 **서로 메시지를 주고받을 수 있습니다.**
    보내는 쪽·받는 쪽 규칙은 방장이든 친구든 **완전히 같습니다.**

    ## 게임 시작

    두 사람이 모여도 게임은 **저절로 시작되지 않습니다.** 방장이
    `{"type":"start"}` 를 보내야 양쪽에 `game_started` 가 갑니다.

    시작하면 **칩 100개를 섞어 각자 7개씩** 나눠 줍니다. 86개가 가방에
    남습니다. 칩이 무엇무엇 있는지(글자·개수·점수)와 보드 배열은
    HTTP 쪽 [`GET /api/game/setup`](/docs#/게임) 에 있습니다.

    ⚠️ `game_started` 는 **양쪽에 다른 내용**이 갑니다. `rack`(내 칩)만
    사람마다 다르고, **상대의 칩은 아예 보내지 않습니다.**

    ## 단어 놓기

    `{"type":"submit","tiles":[...]}` 로 **어느 칸에 어떤 글자를 놓았는지**
    보내면, 백엔드가 판과 맞춰 보고 **인정되면 실제로 판에 올립니다.**
    그러면 `board_updated` 가 **양쪽 모두에게** 갑니다.

    완성된 단어가 아니라 **좌표**를 보내는 이유: 단어만 보내면 판 어디에
    놓인 것인지 알 수 없습니다. 점수는 어느 칸에 놓였는지에 따라 달라집니다.

    **판은 서버가 기억합니다.** 두 사람이 함께 보는 판은 하나뿐이고, 그
    하나가 서버에 있습니다. 각자 화면에만 기억하면 서로 다른 판을 보게
    되고, 그때 어느 쪽이 맞는지 판단할 방법이 없습니다.

    지키는 규칙: 한 줄로 · 첫 수는 한가운데 · 이후는 이미 놓인 글자에
    붙여서 · 겹쳐 놓기 금지 · **이번 수로 새로 생기는 단어가 전부** 사전에
    있을 것. 하나라도 없으면 **아무것도 놓이지 않습니다.**

    ## 차례

    **자기 차례에만 놓을 수 있습니다.** 선공은 무작위로 정해지고,
    한 수 놓을 때마다 상대에게 넘어갑니다.

    내 차례인지는 **`your_turn`** 을 보세요. `turn` 에 닉네임도 오지만,
    두 사람 이름이 같을 수 있어서 이름 비교로는 알 수 없습니다.

    ## 손패와 점수

    놓으면 **쓴 칩이 손에서 빠지고 그만큼 가방에서 채워집니다.** 손에 없는
    칩은 놓을 수 없습니다.

    점수는 세 가지를 더합니다 — **글자 점수 + 보너스 칸 + 7개 다 쓰면 +50.**
    보너스 칸은 **이번에 새로 놓은 자리에서만** 걸립니다. 이미 놓인 글자가
    밟고 있는 칸은 그때 이미 썼습니다.

    빈 타일은 **0점**입니다.

    ## 이 화면이 계약서입니다

    이 화면은 서버가 **요청받을 때마다 새로 그립니다.** 즉 여기 보이는
    것이 항상 지금 백엔드의 약속입니다.

    프론트엔드는 **문서 파일을 복사해 가지 마세요.** 복사한 순간부터
    낡기 시작하고, 백엔드가 바꿔도 알 방법이 없습니다.
    이 주소를 **북마크해 두고 그때그때 보세요.**

    - 웹소켓 (지금 이 화면) → `/ws-docs`
    - HTTP API (스와거) → [`/docs`](/docs)

servers:
  local:
    host: localhost:11000
    protocol: ws
    description: 개발용 로컬 서버. HTTP API 와 같은 포트를 씁니다.

channels:
  ws:
    address: /ws
    title: 연결 확인 통로
    description: |
      접속할 때 넘기는 값은 **없습니다.** 그냥 연결하면 됩니다.
      방 번호·닉네임을 받는 건 방 입장 기능을 붙일 때 정합니다.
    messages:
      connected:
        $ref: '#/components/messages/connected'
      echo:
        $ref: '#/components/messages/echo'
      clientText:
        $ref: '#/components/messages/clientText'

  rooms:
    address: /ws/rooms
    title: 방 만들고 기다리기
    description: |
      접속하는 **그 순간 방이 만들어지고**, 초대 코드가 바로 날아옵니다.
      그 뒤로 연결은 끊지 말고 **그대로 두세요.** 그게 "친구를 기다리는
      상태"입니다. 끊으면 방도 같이 없어집니다.

      닉네임은 주소 뒤에 붙여 보냅니다.
      예: `ws://localhost:11000/ws/rooms?nickname=수진`
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 방을 만드는 사람의 닉네임. 공백 제거 후 1~20자.
              examples: [수진]
    messages:
      roomCreated:
        $ref: '#/components/messages/roomCreated'
      guestJoined:
        $ref: '#/components/messages/guestJoined'
      guestLeft:
        $ref: '#/components/messages/guestLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      startIn:
        $ref: '#/components/messages/startIn'
      gameStarted:
        $ref: '#/components/messages/gameStarted'
      submitIn:
        $ref: '#/components/messages/submitIn'
      wordChecked:
        $ref: '#/components/messages/wordChecked'
      boardUpdated:
        $ref: '#/components/messages/boardUpdated'
      roomError:
        $ref: '#/components/messages/roomError'

  join:
    address: /ws/rooms/{code}
    title: 코드로 방에 들어가기
    description: |
      친구에게 받은 초대 코드로 그 방에 들어갑니다.
      들어가는 데 성공하면 **방장에게도 알림이 갑니다.**

      주소의 `{code}` 자리에 코드를 넣고, 닉네임은 물음표 뒤에 붙입니다.
      예: `ws://localhost:11000/ws/rooms/K7Q2?nickname=엘리`

      **소문자로 쳐도 됩니다.** 서버가 대문자로 맞춰줍니다.
    parameters:
      code:
        description: 방장에게 받은 초대 코드. 대문자·숫자 4자리.
        examples: [K7Q2]
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 들어가는 사람의 닉네임. 공백 제거 후 1~20자.
              examples: [엘리]
    messages:
      joined:
        $ref: '#/components/messages/joined'
      hostLeft:
        $ref: '#/components/messages/hostLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      startIn:
        $ref: '#/components/messages/startIn'
      gameStarted:
        $ref: '#/components/messages/gameStarted'
      submitIn:
        $ref: '#/components/messages/submitIn'
      wordChecked:
        $ref: '#/components/messages/wordChecked'
      boardUpdated:
        $ref: '#/components/messages/boardUpdated'
      joinError:
        $ref: '#/components/messages/joinError'

  match:
    address: /ws/match
    title: 랜덤 매칭 (모르는 사람과)
    description: |
      코드를 주고받지 않고 **아무나 기다리는 사람과 짝지어 줍니다.**

      기다리는 사람이 있으면 **바로** 짝이 되고, 없으면 줄을 서서 다음
      사람이 올 때까지 기다립니다. 그동안 연결은 그대로 두세요.

      짝짓는 순서는 **선착순**입니다. 먼저 와서 기다린 사람이 먼저 짝을
      만납니다. 누구와 만날지는 알 수 없지만 순서까지 뒤죽박죽이면
      먼저 온 사람이 계속 밀려 영영 짝을 못 만나게 됩니다.

      짝이 지어진 뒤는 코드로 만난 것과 **완전히 같습니다.**
      먼저 기다린 사람이 방장이 되고, 채팅 규칙도 그대로입니다.

      대화 중에 상대가 나가도 **연결은 끊기지 않습니다.** 서버가 알아서
      다시 줄을 세워 주고, 마침 기다리는 사람이 있으면 **바로 새 짝**을
      붙여 줍니다. 처음부터 다시 접속하게 하면 기다렸던 시간이 없던 일이
      되고 줄 맨 뒤로 밀리기 때문입니다.
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 내 닉네임. 공백 제거 후 1~20자.
              examples: [엘리]
    messages:
      waiting:
        $ref: '#/components/messages/waiting'
      matched:
        $ref: '#/components/messages/matched'
      partnerLeft:
        $ref: '#/components/messages/partnerLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      startIn:
        $ref: '#/components/messages/startIn'
      gameStarted:
        $ref: '#/components/messages/gameStarted'
      submitIn:
        $ref: '#/components/messages/submitIn'
      wordChecked:
        $ref: '#/components/messages/wordChecked'
      boardUpdated:
        $ref: '#/components/messages/boardUpdated'
      roomError:
        $ref: '#/components/messages/roomError'

operations:
  sendToClient:
    action: send
    channel:
      $ref: '#/channels/ws'
    title: 백엔드 → 프론트엔드
    description: 서버가 보내는 메시지는 **항상 JSON** 이며, `type` 필드로 종류를 구분합니다.
    messages:
      - $ref: '#/channels/ws/messages/connected'
      - $ref: '#/channels/ws/messages/echo'

  receiveFromClient:
    action: receive
    channel:
      $ref: '#/channels/ws'
    title: 프론트엔드 → 백엔드
    description: 지금은 형식이 정해져 있지 않습니다. 아무 문자열이나 보내면 됩니다.
    messages:
      - $ref: '#/channels/ws/messages/clientText'

  sendRoomCreated:
    action: send
    channel:
      $ref: '#/channels/rooms'
    title: 백엔드 → 프론트엔드 (방장이 받는 것)
    description: |
      접속 직후 방이 만들어지면 코드를 보냅니다. 그 뒤로는 **방장이
      요청하지 않아도** 친구가 들어오고 나갈 때마다 소식이 옵니다.
    messages:
      - $ref: '#/channels/rooms/messages/roomCreated'
      - $ref: '#/channels/rooms/messages/guestJoined'
      - $ref: '#/channels/rooms/messages/guestLeft'
      - $ref: '#/channels/rooms/messages/chatOut'
      - $ref: '#/channels/rooms/messages/gameStarted'
      - $ref: '#/channels/rooms/messages/wordChecked'
      - $ref: '#/channels/rooms/messages/boardUpdated'
      - $ref: '#/channels/rooms/messages/roomError'

  receiveChatFromHost:
    action: receive
    channel:
      $ref: '#/channels/rooms'
    title: 프론트엔드 → 백엔드 (방장이 보내는 것)
    description: |
      채팅 메시지를 보내거나, **게임을 시작합니다.** 상대가 아직 없으면
      둘 다 error 가 돌아옵니다.
    messages:
      - $ref: '#/channels/rooms/messages/chatIn'
      - $ref: '#/channels/rooms/messages/startIn'
      - $ref: '#/channels/rooms/messages/submitIn'

  sendJoined:
    action: send
    channel:
      $ref: '#/channels/join'
    title: 백엔드 → 프론트엔드 (들어간 사람이 받는 것)
    description: 들어가는 데 성공했는지 알려주고, 방장이 나가면 그것도 알려줍니다.
    messages:
      - $ref: '#/channels/join/messages/joined'
      - $ref: '#/channels/join/messages/hostLeft'
      - $ref: '#/channels/join/messages/chatOut'
      - $ref: '#/channels/join/messages/gameStarted'
      - $ref: '#/channels/join/messages/wordChecked'
      - $ref: '#/channels/join/messages/boardUpdated'
      - $ref: '#/channels/join/messages/joinError'

  sendMatched:
    action: send
    channel:
      $ref: '#/channels/match'
    title: 백엔드 → 프론트엔드 (매칭)
    description: |
      줄을 섰는지 짝이 지어졌는지 알려주고, 그 뒤로는 채팅 메시지가 옵니다.
    messages:
      - $ref: '#/channels/match/messages/waiting'
      - $ref: '#/channels/match/messages/matched'
      - $ref: '#/channels/match/messages/partnerLeft'
      - $ref: '#/channels/match/messages/chatOut'
      - $ref: '#/channels/match/messages/gameStarted'
      - $ref: '#/channels/match/messages/wordChecked'
      - $ref: '#/channels/match/messages/boardUpdated'
      - $ref: '#/channels/match/messages/roomError'

  receiveChatFromMatched:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: 프론트엔드 → 백엔드 (매칭)
    description: |
      코드로 만났을 때와 **완전히 같은 형식**입니다.

      ⚠️ 게임 시작은 방장만 보낼 수 있는데, 매칭으로 만난 경우 **자기가
      방장인지 알 수 없습니다.** `matched` 에 그 정보가 없기 때문입니다.
      지금은 눌러보고 error 가 오는지로만 알 수 있습니다.
    messages:
      - $ref: '#/channels/match/messages/chatIn'
      - $ref: '#/channels/match/messages/startIn'
      - $ref: '#/channels/match/messages/submitIn'

  receiveChatFromGuest:
    action: receive
    channel:
      $ref: '#/channels/join'
    title: 프론트엔드 → 백엔드 (들어간 사람이 보내는 것)
    description: |
      채팅은 방장이 보내는 것과 **완전히 같은 형식**입니다.
      게임 시작(`start`)은 보낼 수는 있지만 **방장이 아니라서 거절됩니다.**
    messages:
      - $ref: '#/channels/join/messages/chatIn'
      - $ref: '#/channels/join/messages/startIn'
      - $ref: '#/channels/join/messages/submitIn'

components:
  messages:
    connected:
      name: connected
      title: 연결 완료
      summary: 접속 직후 서버가 **먼저** 보냅니다. (1회)
      description: |
        프론트엔드는 이걸 받아야 "연결 완료"를 확신할 수 있습니다.
        연결 상태 표시등을 켜는 시점으로 쓰세요.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: connected
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 안내 문구
      examples:
        - name: 연결 직후
          payload:
            type: connected
            message: 웹소켓 연결됨

    echo:
      name: echo
      title: 메아리 (임시)
      summary: 내가 보낸 문자열을 그대로 돌려줍니다.
      description: |
        ⚠️ **임시 기능입니다.** "선이 진짜 양방향으로 통하는지" 눈으로
        확인하는 용도라, 실제 기능이 붙으면 사라집니다.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: echo
            description: 메시지 종류
          message:
            type: string
            description: 내가 보낸 문자열 그대로
      examples:
        - name: "'안녕' 을 보냈을 때"
          payload:
            type: echo
            message: 안녕

    roomCreated:
      name: room_created
      title: 방이 만들어짐
      summary: 접속 직후 **바로** 옵니다. 여기 담긴 `code` 를 친구에게 알려주세요.
      description: |
        이걸 받은 뒤에는 **연결을 끊지 마세요.** 연결이 살아 있는 동안만
        친구가 그 코드로 들어올 수 있습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, code, name, host_nickname, max_players]
        properties:
          type:
            type: string
            const: room_created
            description: 메시지 종류
          code:
            type: string
            description: |
              초대 코드. 대문자·숫자 4자리이며 `O` `I` `L` `0` `1` 은 나오지 않습니다.
              (불러줄 때 헷갈리지 않게 하려고 뺐습니다)
          name:
            type: string
            description: 자동으로 지어진 방 이름 (`OO님의 방`)
          host_nickname:
            type: string
            description: 방장 닉네임 (앞뒤 공백이 정리된 최종 값)
          max_players:
            type: integer
            description: 정원. 지금은 항상 4
      examples:
        - name: 수진님이 방을 만들었을 때
          payload:
            type: room_created
            code: K7Q2
            name: 수진님의 방
            host_nickname: 수진
            max_players: 4

    waiting:
      name: waiting
      title: 줄을 섰음
      summary: 지금 기다리는 사람이 없어서 **줄을 선 상태**입니다.
      description: |
        연결을 그대로 두고 기다리세요. 다음 사람이 오면 `matched` 가 옵니다.

        화면에는 "상대를 찾는 중…" 같은 안내를 띄우면 됩니다.
      contentType: application/json
      payload:
        type: object
        required: [type, position, nickname]
        properties:
          type:
            type: string
            const: waiting
            description: 메시지 종류
          position:
            type: integer
            description: |
              줄에서 내 순번. `1` 이면 다음에 오는 사람과 바로 짝이 됩니다.
              1:1 이라 사람이 오는 즉시 짝이 지어지므로 보통 항상 `1` 입니다.
          nickname:
            type: string
            description: 내 닉네임 (앞뒤 공백이 정리된 최종 값)
      examples:
        - name: 아무도 없어서 기다리게 됨
          payload:
            type: waiting
            position: 1
            nickname: 엘리

    matched:
      name: matched
      title: 짝이 지어짐
      summary: 상대를 만났습니다. 이제 채팅할 수 있습니다.
      description: |
        **두 사람 모두에게** 갑니다. 기다리던 사람에게는 **요청하지도
        않았는데** 오는 소식입니다 — 이 기능을 웹소켓으로 만든 이유입니다.

        먼저 기다린 사람이 방장이 되지만, 채팅에서 방장과 손님이 하는 일은
        **똑같습니다.** 화면에서 구분해 보여줄 필요가 없습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, code, partner_nickname]
        properties:
          type:
            type: string
            const: matched
            description: 메시지 종류
          code:
            type: string
            description: |
              만들어진 방의 코드. 랜덤 매칭에서는 **쓸 일이 없습니다.**
              (누구에게 알려줄 코드가 아닙니다) 문제가 생겼을 때
              어느 방이었는지 찾는 용도로만 참고하세요.
          partner_nickname:
            type: string
            description: 상대의 닉네임. 화면에 "OO님과의 대화"처럼 띄우세요
      examples:
        - name: 엘리와 짝이 되었을 때
          payload:
            type: matched
            code: 7AH3
            partner_nickname: 엘리

    partnerLeft:
      name: partner_left
      title: 상대가 나감
      summary: 대화하던 상대가 연결을 끊었습니다. **연결은 끊기지 않습니다.**
      description: |
        1:1 이라 상대가 나가면 대화가 성립하지 않습니다. 하지만 남은 사람은
        잘못이 없으므로 **연결을 끊지 않고 서버가 알아서 다시 줄을 세워
        줍니다.** 처음부터 다시 접속하게 하면 기다렸던 시간이 없던 일이
        되고 줄 맨 뒤로 밀리기 때문입니다.

        이 메시지 **바로 뒤에 둘 중 하나**가 옵니다.

        - `waiting` — 기다리는 사람이 없어서 줄 맨 앞에 다시 섰습니다.
        - `matched` — 마침 기다리는 사람이 있어서 **바로 새 짝**이 생겼습니다.

        새 짝이 생기면 **방도 새로 만들어집니다.** `code` 가 달라지고,
        이전 방의 대화는 그 방에 남습니다. (이어지지 않습니다)

        화면에서는 대화창을 비우고 "상대가 나갔습니다. 새 상대를 찾는 중…"
        정도를 띄우면 됩니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: partner_left
            description: 메시지 종류
          nickname:
            type: string
            description: 나간 사람의 닉네임
      examples:
        - name: 엘리가 나갔을 때
          payload:
            type: partner_left
            nickname: 엘리

    chatIn:
      name: message (보내는 쪽)
      title: 채팅 메시지 보내기
      summary: 상대에게 할 말을 보냅니다. **방장·친구 모두 같은 형식**입니다.
      description: |
        문자열이 아니라 **JSON 으로** 보내야 합니다.

        ```javascript
        ws.send(JSON.stringify({ type: "message", text: "안녕" }));
        ```

        앞뒤 공백은 서버가 정리합니다. 규칙에 안 맞으면 `error` 가 돌아오지만
        **연결은 끊기지 않습니다.** 고쳐서 다시 보내면 됩니다.

        보낸 말은 **DB 에 저장된 뒤** 상대에게 전달됩니다. 순서가 이런 이유:
        전달 먼저 하면, 저장이 실패했을 때 화면에는 떴는데 기록에는 없는 말이
        생깁니다. 나중에 대화를 꺼내 보면 조용히 한 줄이 비어 있게 됩니다.
        거절된 메시지는 **저장되지 않습니다.**
      contentType: application/json
      payload:
        type: object
        required: [type, text]
        properties:
          type:
            type: string
            const: message
            description: 메시지 종류. 대화를 보낼 때는 이 값입니다 (게임 시작은 `start`)
          text:
            type: string
            description: 할 말. 공백 제거 후 1~500자
      examples:
        - name: 인사 보내기
          payload:
            type: message
            text: 안녕

    chatOut:
      name: message (받는 쪽)
      title: 채팅 메시지 받기
      summary: 상대가 보낸 말이 도착했습니다.
      description: |
        ⚠️ **내가 보낸 말은 나에게 되돌아오지 않습니다.** 내 말은 내 화면에
        바로 그리세요. 되돌려 주면 같은 말이 두 번 그려지기 쉽습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, from, text, at]
        properties:
          type:
            type: string
            const: message
            description: 메시지 종류
          from:
            type: string
            description: 보낸 사람의 닉네임
          text:
            type: string
            description: 보낸 내용 (앞뒤 공백이 정리된 값)
          at:
            type: string
            description: |
              **DB 가 저장하면서 찍은 시각** (ISO 8601). 각자 컴퓨터의 시계가
              아니라 서버 시계입니다. 그래야 두 사람 화면에서 순서가 같고,
              저장된 기록과도 한 글자도 어긋나지 않습니다.
      examples:
        - name: 수진님이 보낸 말
          payload:
            type: message
            from: 수진
            text: 안녕 엘리
            at: '2026-08-08T13:22:38.694059'

    startIn:
      name: start (보내는 쪽)
      title: 게임 시작 누르기
      summary: 방장이 게임을 시작합니다. **방장만** 보낼 수 있습니다.
      description: |
        두 사람이 다 모여도 게임은 저절로 시작되지 않습니다. 들어오자마자
        판이 시작되면 준비할 틈이 없기 때문입니다.

        ```javascript
        ws.send(JSON.stringify({ type: "start" }));
        ```

        **채팅과 같은 연결**을 씁니다. 새로 접속할 필요가 없습니다.

        누가 눌렀는지는 **연결로 판단**하므로 닉네임을 같이 보낼 필요가
        없습니다. 닉네임으로 판단하면 서로 이름이 같을 때(둘 다 "수진")
        친구가 방장 이름을 그대로 쓰는 것만으로 게임을 시작할 수 있게
        됩니다.

        방장이 누구인가:
          - 코드로 만난 방 → 방을 만든 사람 (`/ws/rooms` 로 접속한 쪽)
          - 랜덤 매칭 → **먼저 와서 기다린 사람**

        안 되는 경우에는 **누른 사람에게만** `error` 가 돌아옵니다.
        상대에게는 아무것도 가지 않고, 연결도 끊기지 않습니다.
          - `방장만 게임을 시작할 수 있습니다`
          - `이미 시작된 게임입니다` (버튼을 두 번 눌렀을 때)
          - `아직 상대가 들어오지 않았습니다`
          - `게임을 시작하지 못했습니다. 잠시 후 다시 눌러 주세요` (저장 실패)
      contentType: application/json
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            const: start
            description: 메시지 종류. 게임을 시작할 때는 이 값입니다
      examples:
        - name: 게임 시작
          payload:
            type: start

    gameStarted:
      name: game_started
      title: 게임이 시작됨 (+ 칩 배분)
      summary: 게임이 시작되고 **칩 7개**를 받습니다. 양쪽에 가지만 `rack` 은 서로 다릅니다.
      description: |
        ⚠️ **`rack` 은 사람마다 다릅니다.** 내 칩은 나에게만 오고, **상대의
        칩은 아예 보내지 않습니다.** 개수(`partner_tile_count`)만 갑니다.

        프론트엔드가 "안 그리면 되지"로 처리하면 안 됩니다 — 브라우저
        개발자 도구를 열면 오간 내용이 그대로 보입니다. **보내지 않는
        것만이 가리는 방법**이라 서버에서 갈라 보냅니다.
        상대 칩은 뒷면 `partner_tile_count` 장으로 그리세요.

        나머지 필드(`code`, `first_turn`, `at`, `tiles_left`)는 양쪽이 같습니다.

        ⚠️ **누른 사람에게도 옵니다.** 채팅과 다른 점입니다. 서버가 정해 주는
        값(누가 선공인지·내 칩이 무엇인지)이 있어서 방장도 받아서 그립니다.
        누른 즉시 화면을 바꾸지 말고, 이 메시지를 받고 바꾸세요.

        칩이 무엇무엇 있는지(글자·개수·점수)는 HTTP `GET /api/game/setup` 에
        있습니다. **시작할 때 한 번만** 받아 두면 됩니다.

        ⚠️ 여기까지가 "시작"입니다. **판에 단어를 놓거나·칩을 다시 뽑거나·
        점수를 매기는 것은 아직 없습니다.** 각각 별도 기능입니다.

        게임 중에 상대가 나가면 그 판은 거기서 끝납니다. 다만 `game_over`
        같은 메시지가 따로 가지는 않으므로, `guest_left` / `partner_left`
        를 받으면 끝난 것으로 처리하세요.
      contentType: application/json
      payload:
        type: object
        required:
          [type, code, host_nickname, guest_nickname, first_turn, turn,
           your_turn, at, rack, partner_tile_count, tiles_left, board, scores]
        properties:
          type:
            type: string
            const: game_started
            description: 메시지 종류
          code:
            type: string
            description: 방 코드
          host_nickname:
            type: string
            description: 방장 닉네임
          guest_nickname:
            type: string
            description: 친구 닉네임
          first_turn:
            type: string
            description: |
              **먼저 두는 사람의 닉네임.** 방장이 아니라 **무작위**입니다.
              스크래블에서 선공은 유리한 자리라, 방을 만들었다는 이유만으로
              매번 먼저 두면 공평하지 않기 때문입니다.

              이 값은 **끝까지 안 바뀝니다.** "지금 차례"는 `turn` 입니다.
          turn:
            type: string
            description: |
              **지금 차례인 사람의 닉네임.** 시작 시점에는 `first_turn` 과
              같지만, 한 수 둘 때마다 바뀝니다. (`first_turn` = 이 게임의
              선공, `turn` = 지금 차례)

              ⚠️ **화면에 보여줄 때만 쓰세요.** 두 사람 이름이 같을 수 있어서
              이 값으로는 내 차례인지 알 수 없습니다. 그건 `your_turn` 을 보세요.
          your_turn:
            type: boolean
            description: |
              **받는 사람 본인의 차례인가.** `rack` 과 함께 사람마다 다른
              값입니다.

              닉네임 비교(`turn === 내닉네임`)로 판단하면 **두 사람 이름이
              같을 때 둘 다 자기 차례로 착각합니다.** 이 값을 쓰세요.
          at:
            type: string
            description: |
              **DB 가 저장하면서 찍은 시작 시각** (ISO 8601).
              `rooms.started_at` 에 같은 값이 남습니다.
          rack:
            type: array
            minItems: 7
            maxItems: 7
            items:
              type: string
            description: |
              **받는 사람 본인의 칩 7개.** 이 값만 사람마다 다릅니다.

              각 글자는 `GET /api/game/setup` 의 `tiles[].letter` 와 같습니다.
              `"?"` 는 **빈 타일**로, 아무 글자로나 쓸 수 있는 대신 0점입니다.
              `rack` 에 들어올 수 있으니 화면에서 처리해 주세요.

              매번 예측할 수 없는 방식으로 섞기 때문에, 상대가 다음에 뽑을
              칩을 미리 알아낼 수 없습니다.
          partner_tile_count:
            type: integer
            description: |
              **상대가 든 칩 개수만.** 무엇을 들었는지는 오지 않습니다.
              시작 직후에는 늘 7 입니다. 상대 칩을 뒷면 몇 장으로 그릴지
              정하는 데 씁니다.
          board:
            type: array
            description: |
              **시작 시점의 판 (15줄 × 15칸).** 시작 직후에는 전부 `""` 로
              비어 있지만 그래도 보냅니다. 프론트엔드가 빈 판을 스스로
              만들면 크기가 어긋날 수 있고, 무엇보다 **판은 언제나 서버가
              준 것을 그린다**는 규칙이 한 군데서 깨지면 나머지도 흔들립니다.
            items:
              type: array
              items: {type: string}
          scores:
            type: object
            description: |
              **시작 점수.** 둘 다 0 이지만, 점수판 자리를 처음부터 서버가
              준 값으로 채우게 하려고 함께 보냅니다.
            properties:
              host: {type: integer}
              guest: {type: integer}
          tiles_left:
            type: integer
            description: |
              가방에 남은 칩 개수. 시작 직후에는 **86** 입니다
              (100 − 7 − 7). 실제 스크래블에서도 남은 개수는 서로 볼 수
              있습니다. **무엇이** 남았는지는 아닙니다.
      examples:
        - name: 방장이 받는 것 (친구가 선공)
          payload:
            type: game_started
            code: K7Q2
            host_nickname: 수진
            guest_nickname: 엘리
            first_turn: 엘리
            turn: 엘리
            your_turn: false
            tiles_left: 83
            partner_tile_count: 7
            score:
              words: [{word: CAT, score: 10}]
              words_score: 10
              bingo: 0
              total: 10
            scores: {host: 10, guest: 0}
            at: '2026-08-15T14:02:11.482913'
            rack: [E, A, T, '?', R, N, S]
            partner_tile_count: 7
            tiles_left: 86
            scores: {host: 0, guest: 0}
        - name: 친구가 받는 것 (같은 게임 — rack 만 다름)
          payload:
            type: game_started
            code: K7Q2
            host_nickname: 수진
            guest_nickname: 엘리
            first_turn: 엘리
            turn: 엘리
            your_turn: true
            at: '2026-08-15T14:02:11.482913'
            rack: [O, I, D, L, G, U, M]
            partner_tile_count: 7
            tiles_left: 86
            scores: {host: 0, guest: 0}

    submitIn:
      name: submit (보내는 쪽)
      title: 단어 제출하기 — 좌표를 보냅니다
      summary: 어느 칸에 어떤 글자를 놓았는지 보내면, **사전에 있는 단어인지** 알려줍니다.
      description: |
        완성된 단어(`{"word":"CAT"}`)가 아니라 **좌표**를 보냅니다.
        단어만 보내면 판 어디에 놓인 것인지 알 수 없기 때문입니다. 점수는
        어느 칸에 놓였는지에 따라 달라지고(글자 2배 칸 등), 판에 실제로
        놓으려면 자리도 알아야 합니다. **좌표가 원본이고 단어는 결과입니다.**

        ```javascript
        ws.send(JSON.stringify({
          type: "submit",
          tiles: [
            { row: 7, col: 7, letter: "C" },
            { row: 7, col: 8, letter: "A" },
            { row: 7, col: 9, letter: "T" }
          ]
        }));
        ```

        `row` 는 위에서부터, `col` 은 왼쪽부터 **0 부터** 셉니다.
        HTTP `GET /api/game/setup` 의 `board[줄][칸]` 과 같은 방식입니다.

        **빈 타일(`?`)은 그대로 보내면 안 됩니다.** 무슨 글자로 쓸지 정해서
        그 글자를 보내세요. `?` 인 채로는 무슨 단어인지 판단할 수 없습니다.

        놓는 규칙:
          - **한 줄로** (가로 또는 세로)
          - **첫 수는 한가운데(7, 7)를 지나야** 합니다
          - **두 번째부터는 이미 놓인 글자에 닿아야** 합니다 (따로 떨어져 못 놓음)
          - 이미 글자가 있는 칸에는 못 놓습니다
          - 사이가 비면 안 됩니다. 단 **이미 판에 놓인 글자가 사이를 메우는 건 됩니다**
          - 1~7개. 손에 7개뿐이라 8개는 못 놓습니다.
            **한 개만 놓아도 됩니다** — 이미 놓인 글자에 붙어 단어가 되면 인정됩니다
          - 같은 칸에 두 장 금지

        **이번 수로 새로 생기는 단어가 전부** 사전에 있어야 합니다.
        가로로 한 단어를 놓아도, 그 글자들이 위아래 글자와 붙으면서
        **세로 단어가 여러 개 새로 생깁니다.** 그중 하나라도 사전에
        없으면 **아무것도 놓이지 않습니다.**

        좌표가 규칙에 안 맞으면 `error` 가 돌아오지만 **연결은 끊기지
        않습니다.** 고쳐서 다시 보내면 됩니다.

        **자기 차례에만 놓을 수 있습니다.** 차례가 아니면 `error` 가
        돌아오고, 그 안에 `turn`(누구 차례인지)과 `your_turn: false` 가
        함께 옵니다. 게임이 시작되기 전에도 놓을 수 없습니다.

        놓기에 **성공했을 때만** 차례가 넘어갑니다. 사전에 없는 단어를
        내거나 자리가 잘못돼서 거절되면 **차례는 그대로 나에게 있습니다.**

        **손에 있는 칩만 놓을 수 있습니다.** 없으면
        `손에 없는 칩입니다: Z` 가 돌아옵니다.

        빈 타일은 `?` 가 아니라 **정한 글자로** 보내세요. 서버는 진짜 글자를
        먼저 쓰고, 그게 없을 때만 빈 타일을 씁니다. (빈 타일은 아껴 두는 게
        이득이라 사람도 그렇게 씁니다)
      contentType: application/json
      payload:
        type: object
        required: [type, tiles]
        properties:
          type:
            type: string
            const: submit
            description: 메시지 종류. 단어를 제출할 때는 이 값입니다
          tiles:
            type: array
            minItems: 1
            maxItems: 7
            description: |
              이번에 **새로 놓는** 칩들. 이미 판에 있는 글자는 넣지 마세요.
              한 줄로, 사이가 비지 않게(이미 놓인 글자가 메우는 건 됨).
            items:
              type: object
              required: [row, col, letter]
              properties:
                row:
                  type: integer
                  minimum: 0
                  maximum: 14
                  description: 위에서부터 몇 번째 줄인지 (0 부터)
                col:
                  type: integer
                  minimum: 0
                  maximum: 14
                  description: 왼쪽부터 몇 번째 칸인지 (0 부터)
                letter:
                  type: string
                  minLength: 1
                  maxLength: 1
                  description: |
                    알파벳 한 글자. 소문자로 보내도 됩니다.
                    **빈 타일은 `?` 가 아니라 쓸 글자를 보내세요.**
      examples:
        - name: 한가운데에 가로로 CAT
          payload:
            type: submit
            tiles:
              - {row: 7, col: 7, letter: C}
              - {row: 7, col: 8, letter: A}
              - {row: 7, col: 9, letter: T}

    wordChecked:
      name: word_checked
      title: 제출 결과 — 놓였는지 아닌지
      summary: 제출한 수가 판에 놓였는지 알려줍니다. **보낸 사람에게만** 갑니다.
      description: |
        `placed` 가 `true` 면 **판에 실제로 올라갔습니다.** 이때는 바로 뒤에
        `board_updated` 가 **양쪽 모두에게** 갑니다.

        `valid` 가 `false` 면 새로 생기는 단어 중 사전에 없는 것이
        있다는 뜻이고, 이때는 **아무것도 놓이지 않습니다.** 일부만 놓으면
        판이 반쯤 바뀐 채로 남아 되돌릴 수 없기 때문입니다.

        **`valid: false` 는 `error` 가 아닙니다.** 없는 단어를 낸 것은
        고장이 아니라 게임에서 흔히 있는 일입니다.
        (`error` 는 애초에 놓을 수 없는 자리인 경우 — 한 줄이 아니거나,
        겹치거나, 떨어져 있거나, 첫 수가 한가운데를 안 지나거나 할 때)

        `words` 에는 **이번 수로 새로 생기는 단어가 전부** 들어 있습니다.
        하나가 아닐 수 있습니다. 가로로 놓아도 위아래로 세로 단어가
        같이 생기기 때문입니다.

        **상대에게는 아무것도 가지 않습니다.** 놓이지 않았다면 상대 화면에
        변화가 없고, "상대가 시도했다 실패했다"를 알려줄 이유도 없습니다.

        사전은 **20만 단어**이고 고유명사는 빠져 있습니다. 대소문자는
        가리지 않습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, valid, placed, direction, words]
        properties:
          type:
            type: string
            const: word_checked
            description: 메시지 종류
          valid:
            type: boolean
            description: 새로 생기는 단어가 **전부** 사전에 있으면 `true`
          placed:
            type: boolean
            description: |
              **판에 실제로 올라갔는가.** `true` 면 바로 뒤에
              `board_updated` 가 양쪽에 옵니다.
          direction:
            type: string
            enum: [across, down]
            description: '`across` = 가로, `down` = 세로'
          words:
            type: array
            description: |
              이번 수로 **새로 생기는 단어 전부.** 하나가 아닐 수 있습니다.
              어느 단어가 문제였는지 화면에 표시하는 데 씁니다.
            items:
              type: object
              properties:
                word:
                  type: string
                  description: 단어 (항상 대문자)
                valid:
                  type: boolean
                  description: 이 단어가 사전에 있으면 `true`
                tiles:
                  type: array
                  description: 그 단어를 이루는 칸들. **이미 판에 있던 글자도 포함**됩니다.
          rack:
            type: array
            items: {type: string}
            description: |
              **놓은 뒤의 내 손패.** `placed: true` 일 때만 옵니다.
              쓴 칩이 빠지고 **놓은 개수만큼 가방에서 채워져** 다시 7개입니다.
              (가방이 바닥나면 7개보다 적을 수 있습니다)

              **놓은 사람에게만** 갑니다. 상대에게 보내면 내가 무슨 칩을
              들었는지 그대로 알려주는 셈입니다.
          drawn:
            type: array
            items: {type: string}
            description: 이번에 **새로 뽑은 칩.** 화면에서 새로 온 칩을 표시하는 데 쓰면 됩니다.
          tiles_left:
            type: integer
            description: 뽑고 난 뒤 가방에 남은 개수
          score:
            type: object
            description: |
              **이번 수로 얻은 점수.** `placed: true` 일 때만 옵니다.
              `board_updated` 에도 같은 값이 들어 있습니다.
            properties:
              words:
                type: array
                description: 단어별 점수 내역. 화면에 "CAT 10점" 처럼 풀어 보여주는 데 씁니다.
                items:
                  type: object
                  properties:
                    word: {type: string, description: 단어}
                    score: {type: integer, description: 그 단어의 점수}
              words_score:
                type: integer
                description: 단어 점수 합계 (빙고 제외)
              bingo:
                type: integer
                description: |
                  손패 7개를 한 번에 다 썼을 때 주는 **+50점.** 아니면 0.
              total:
                type: integer
                description: '`words_score` + `bingo`'
          reason:
            type: string
            description: '`valid` 가 `false` 일 때만. 어느 단어가 사전에 없는지.'
      examples:
        - name: 놓임 — 두 단어가 함께 생김
          payload:
            type: word_checked
            valid: true
            placed: true
            direction: across
            words:
              - word: 'ON'
                valid: true
                tiles: [{row: 8, col: 8, letter: O}, {row: 8, col: 9, letter: 'N'}]
              - word: TO
                valid: true
                tiles: [{row: 7, col: 8, letter: T}, {row: 8, col: 8, letter: O}]
            rack: [E, A, R, S, T, L, I]
            drawn: [L, I]
            tiles_left: 84
            score:
              words:
                - {word: 'ON', score: 2}
                - {word: TO, score: 2}
              words_score: 4
              bingo: 0
              total: 4
        - name: 안 놓임 — 교차 단어가 사전에 없음
          payload:
            type: word_checked
            valid: false
            placed: false
            direction: across
            reason: '사전에 없는 단어입니다: XT, CX'
            words:
              - word: XT
                valid: false
                tiles: [{row: 8, col: 6, letter: X}, {row: 8, col: 7, letter: T}]
              - word: CX
                valid: false
                tiles: [{row: 7, col: 6, letter: C}, {row: 8, col: 6, letter: X}]

    boardUpdated:
      name: board_updated
      title: 판이 바뀜
      summary: 누군가 단어를 놓아 판이 바뀌었습니다. **양쪽 모두에게** 갑니다.
      description: |
        판은 두 사람이 **함께 보는 하나**라서, 바뀌면 양쪽 다 알아야 합니다.
        한쪽만 알면 서로 다른 판을 보게 되고, 그때 어느 쪽이 맞는지
        판단할 방법이 없습니다.

        **놓은 사람에게도 옵니다.** 자기 화면을 자기가 그리지 말고
        `board` 를 받아서 그리세요. 판은 언제나 **서버가 준 것**이
        맞습니다.

        `board` 는 판 전체(15×15)입니다. 바뀐 부분만 보내지 않고 통째로
        보내는 이유: 프론트엔드가 조각을 모아 판을 맞추다 한 번이라도
        놓치면 그 뒤로 계속 어긋납니다. 통째로 받으면 매번 정확합니다.

        빈 칸은 빈 문자열(`""`)입니다.
        `board[줄][칸]` 으로 찾고 둘 다 0 부터 셉니다 —
        HTTP `GET /api/game/setup` 의 보드 배열과 같은 방식입니다.
        (저쪽은 **글자 2배 같은 칸의 성격**이고, 이쪽은 **지금 놓인 글자**입니다.
         두 개를 겹쳐서 화면을 그리면 됩니다.)
      contentType: application/json
      payload:
        type: object
        required: [type, by, direction, tiles, words, board, turn, your_turn,
                   tiles_left, partner_tile_count, score, scores]
        properties:
          type:
            type: string
            const: board_updated
            description: 메시지 종류
          by:
            type: string
            description: 놓은 사람의 닉네임
          direction:
            type: string
            enum: [across, down]
            description: '`across` = 가로, `down` = 세로'
          tiles:
            type: array
            description: 이번에 **새로 놓인** 칩들. 방금 놓인 자리를 반짝이게 하는 데 쓰면 됩니다.
            items:
              type: object
              properties:
                row: {type: integer, description: 위에서부터 몇 번째 줄인지 (0 부터)}
                col: {type: integer, description: 왼쪽부터 몇 번째 칸인지 (0 부터)}
                letter: {type: string, description: 놓인 글자 (대문자)}
          words:
            type: array
            items: {type: string}
            description: 이번 수로 새로 생긴 단어들
          board:
            type: array
            description: |
              **판 전체 (15줄 × 15칸).** 빈 칸은 `""`.
              이것을 그대로 그리세요.
            items:
              type: array
              items: {type: string}
          turn:
            type: string
            description: |
              **이제 누구 차례인지.** 방금 놓은 사람의 **상대**입니다.
              화면에 보여줄 때만 쓰세요.
          your_turn:
            type: boolean
            description: |
              **받는 사람 본인의 차례인가.** 놓은 사람은 `false`,
              상대는 `true` 가 됩니다. (사람마다 다른 값)
          tiles_left:
            type: integer
            description: 가방에 남은 칩 개수. 놓은 사람이 그만큼 다시 뽑아서 줄어듭니다.
          partner_tile_count:
            type: integer
            description: |
              **상대가 든 칩 개수.** (사람마다 다른 값)
              무엇을 들었는지는 오지 않습니다.
          score:
            type: object
            description: |
              **이번 수로 얻은 점수.** 단어별 내역까지 들어 있어서
              "OO님이 CAT 으로 10점" 처럼 보여줄 수 있습니다.
            properties:
              words:
                type: array
                items:
                  type: object
                  properties:
                    word: {type: string}
                    score: {type: integer}
              words_score: {type: integer, description: 단어 점수 합계}
              bingo: {type: integer, description: '7개 다 썼으면 50, 아니면 0'}
              total: {type: integer, description: 이번 수 총점}
          scores:
            type: object
            description: |
              **지금까지 쌓인 두 사람 점수.** 점수판은 둘 다 보는 것이라
              양쪽에 같은 값이 갑니다.
            properties:
              host: {type: integer, description: 방장 누적 점수}
              guest: {type: integer, description: 친구 누적 점수}
      examples:
        - name: 수진님이 CAT 을 놓음
          payload:
            type: board_updated
            by: 수진
            direction: across
            tiles:
              - {row: 7, col: 6, letter: C}
              - {row: 7, col: 7, letter: A}
              - {row: 7, col: 8, letter: T}
            words: [CAT]
            board: ['…15줄 × 15칸…']
            turn: 엘리
            your_turn: false
            tiles_left: 83
            partner_tile_count: 7
            score:
              words: [{word: CAT, score: 10}]
              words_score: 10
              bingo: 0
              total: 10
            scores: {host: 10, guest: 0}

    guestJoined:
      name: guest_joined
      title: 친구가 들어옴
      summary: 친구가 코드를 치고 들어왔을 때 **방장에게** 옵니다.
      description: |
        **방장이 요청하지 않았는데 오는 메시지입니다.** 이 기능을 웹소켓으로
        만든 이유가 바로 이것입니다. HTTP 였다면 방장이 "혹시 들어왔나요?"를
        계속 물어봐야 했습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: guest_joined
            description: 메시지 종류
          nickname:
            type: string
            description: 들어온 사람의 닉네임
      examples:
        - name: 엘리가 들어왔을 때
          payload:
            type: guest_joined
            nickname: 엘리

    guestLeft:
      name: guest_left
      title: 친구가 나감
      summary: 들어와 있던 친구가 연결을 끊었을 때 **방장에게** 옵니다.
      description: |
        자리가 다시 비므로, **같은 코드로 다른 사람이 들어올 수 있습니다.**
        방장의 연결은 그대로 살아 있습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: guest_left
            description: 메시지 종류
          nickname:
            type: string
            description: 나간 사람의 닉네임
      examples:
        - name: 엘리가 나갔을 때
          payload:
            type: guest_left
            nickname: 엘리

    joined:
      name: joined
      title: 방에 들어감
      summary: 코드가 맞고 자리가 있으면 **바로** 옵니다.
      description: |
        이걸 받으면 두 명이 다 모인 것입니다. 연결을 끊지 마세요.
      contentType: application/json
      payload:
        type: object
        required: [type, code, host_nickname, guest_nickname]
        properties:
          type:
            type: string
            const: joined
            description: 메시지 종류
          code:
            type: string
            description: 들어간 방의 코드 (대문자로 맞춰진 값)
          host_nickname:
            type: string
            description: 방장 닉네임. 화면에 "OO님과의 대화"처럼 띄우는 데 씁니다
          guest_nickname:
            type: string
            description: 내 닉네임 (앞뒤 공백이 정리된 최종 값)
      examples:
        - name: 엘리가 수진님의 방에 들어갔을 때
          payload:
            type: joined
            code: K7Q2
            host_nickname: 수진
            guest_nickname: 엘리

    hostLeft:
      name: host_left
      title: 방장이 나감
      summary: 방장이 연결을 끊었을 때 **들어와 있던 사람에게** 옵니다.
      description: |
        1:1 대화라 방장이 나가면 대화가 성립하지 않습니다. 이 메시지를
        받은 **직후 연결도 함께 닫힙니다.** (닫는 코드 `1001`)

        그 코드는 이제 죽었습니다. 다시 들어가려면 **새 코드를 받아야** 합니다.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: host_left
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 안내 문구
      examples:
        - name: 방장이 탭을 닫았을 때
          payload:
            type: host_left
            message: 방장이 나갔습니다

    joinError:
      name: error
      title: 들어가지 못함
