# ─────────────────────────────────────────────────────────────
# 웹소켓 명세 (AsyncAPI 3.0)
#
# 이 파일이 웹소켓 계약의 "원본"입니다.
#   - 사람이 읽는 설명  → docs/ws-contract.md
#   - 기계가 읽는 계약  → 이 파일          ← openapi.json 과 같은 자리
#   - 눈으로 보는 화면  → http://localhost:11000/ws-docs
#
# HTTP API 는 FastAPI 가 openapi.json 을 자동으로 만들어 주지만,
# 웹소켓은 그런 게 없어서 이 파일을 손으로 씁니다.
#
# ⚠️ 웹소켓을 고치면 이 파일도 함께 고쳐야 합니다.
#    코드와 자동으로 연결돼 있지 않아서, 안 고치면 조용히 거짓말하는
#    문서가 됩니다. /ws-docs 화면은 이 파일을 그대로 읽어 그립니다.
# ─────────────────────────────────────────────────────────────
asyncapi: 3.0.0

info:
  title: 스크래블 웹소켓
  version: 0.1.0
  description: |
    실시간 통로입니다. HTTP API 와 달리 **연결이 계속 이어져 있어서
    백엔드가 먼저 말을 걸 수 있습니다.**

    만나는 방법이 **두 가지** 있습니다.

    - **아는 사람과** — 방장이 `/ws/rooms` 로 방을 만들어 초대 코드를 받고,
      친구가 `/ws/rooms/{code}` 로 그 코드를 치고 들어옵니다.
    - **모르는 사람과** — 둘 다 `/ws/match` 에 접속하면 서버가 짝지어 줍니다.
      먼저 기다린 사람이 먼저 짝을 만납니다. (선착순)

    **어떻게 만났든 그 뒤는 완전히 같습니다.** 같은 방, 같은 채팅을 씁니다.

    `/ws` 는 연결이 되는지 확인만 하는 통로입니다. (실제 기능 아님)

    채팅은 **1:1** 입니다.

    자리가 하나뿐이라 세 번째 사람은 들어올 수 없습니다.

    두 사람이 모이면 **서로 메시지를 주고받을 수 있습니다.**
    보내는 쪽·받는 쪽 규칙은 방장이든 친구든 **완전히 같습니다.**

servers:
  local:
    host: localhost:11000
    protocol: ws
    description: 개발용 로컬 서버. HTTP API 와 같은 포트를 씁니다.

channels:
  ws:
    address: /ws
    title: 연결 확인 통로
    description: |
      접속할 때 넘기는 값은 **없습니다.** 그냥 연결하면 됩니다.
      방 번호·닉네임을 받는 건 방 입장 기능을 붙일 때 정합니다.
    messages:
      connected:
        $ref: '#/components/messages/connected'
      echo:
        $ref: '#/components/messages/echo'
      clientText:
        $ref: '#/components/messages/clientText'

  rooms:
    address: /ws/rooms
    title: 방 만들고 기다리기
    description: |
      접속하는 **그 순간 방이 만들어지고**, 초대 코드가 바로 날아옵니다.
      그 뒤로 연결은 끊지 말고 **그대로 두세요.** 그게 "친구를 기다리는
      상태"입니다. 끊으면 방도 같이 없어집니다.

      닉네임은 주소 뒤에 붙여 보냅니다.
      예: `ws://localhost:11000/ws/rooms?nickname=수진`
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 방을 만드는 사람의 닉네임. 공백 제거 후 1~20자.
              examples: [수진]
    messages:
      roomCreated:
        $ref: '#/components/messages/roomCreated'
      guestJoined:
        $ref: '#/components/messages/guestJoined'
      guestLeft:
        $ref: '#/components/messages/guestLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      roomError:
        $ref: '#/components/messages/roomError'

  join:
    address: /ws/rooms/{code}
    title: 코드로 방에 들어가기
    description: |
      친구에게 받은 초대 코드로 그 방에 들어갑니다.
      들어가는 데 성공하면 **방장에게도 알림이 갑니다.**

      주소의 `{code}` 자리에 코드를 넣고, 닉네임은 물음표 뒤에 붙입니다.
      예: `ws://localhost:11000/ws/rooms/DQDZ3Z?nickname=엘리`

      **소문자로 쳐도 됩니다.** 서버가 대문자로 맞춰줍니다.
    parameters:
      code:
        description: 방장에게 받은 초대 코드. 대문자·숫자 6자리.
        examples: [DQDZ3Z]
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 들어가는 사람의 닉네임. 공백 제거 후 1~20자.
              examples: [엘리]
    messages:
      joined:
        $ref: '#/components/messages/joined'
      hostLeft:
        $ref: '#/components/messages/hostLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      joinError:
        $ref: '#/components/messages/joinError'

  match:
    address: /ws/match
    title: 랜덤 매칭 (모르는 사람과)
    description: |
      코드를 주고받지 않고 **아무나 기다리는 사람과 짝지어 줍니다.**

      기다리는 사람이 있으면 **바로** 짝이 되고, 없으면 줄을 서서 다음
      사람이 올 때까지 기다립니다. 그동안 연결은 그대로 두세요.

      짝짓는 순서는 **선착순**입니다. 먼저 와서 기다린 사람이 먼저 짝을
      만납니다. 누구와 만날지는 알 수 없지만 순서까지 뒤죽박죽이면
      먼저 온 사람이 계속 밀려 영영 짝을 못 만나게 됩니다.

      짝이 지어진 뒤는 코드로 만난 것과 **완전히 같습니다.**
      먼저 기다린 사람이 방장이 되고, 채팅 규칙도 그대로입니다.
    bindings:
      ws:
        query:
          type: object
          required: [nickname]
          properties:
            nickname:
              type: string
              description: 내 닉네임. 공백 제거 후 1~20자.
              examples: [엘리]
    messages:
      waiting:
        $ref: '#/components/messages/waiting'
      matched:
        $ref: '#/components/messages/matched'
      partnerLeft:
        $ref: '#/components/messages/partnerLeft'
      chatIn:
        $ref: '#/components/messages/chatIn'
      chatOut:
        $ref: '#/components/messages/chatOut'
      roomError:
        $ref: '#/components/messages/roomError'

operations:
  sendToClient:
    action: send
    channel:
      $ref: '#/channels/ws'
    title: 백엔드 → 프론트엔드
    description: 서버가 보내는 메시지는 **항상 JSON** 이며, `type` 필드로 종류를 구분합니다.
    messages:
      - $ref: '#/channels/ws/messages/connected'
      - $ref: '#/channels/ws/messages/echo'

  receiveFromClient:
    action: receive
    channel:
      $ref: '#/channels/ws'
    title: 프론트엔드 → 백엔드
    description: 지금은 형식이 정해져 있지 않습니다. 아무 문자열이나 보내면 됩니다.
    messages:
      - $ref: '#/channels/ws/messages/clientText'

  sendRoomCreated:
    action: send
    channel:
      $ref: '#/channels/rooms'
    title: 백엔드 → 프론트엔드 (방장이 받는 것)
    description: |
      접속 직후 방이 만들어지면 코드를 보냅니다. 그 뒤로는 **방장이
      요청하지 않아도** 친구가 들어오고 나갈 때마다 소식이 옵니다.
    messages:
      - $ref: '#/channels/rooms/messages/roomCreated'
      - $ref: '#/channels/rooms/messages/guestJoined'
      - $ref: '#/channels/rooms/messages/guestLeft'
      - $ref: '#/channels/rooms/messages/chatOut'
      - $ref: '#/channels/rooms/messages/roomError'

  receiveChatFromHost:
    action: receive
    channel:
      $ref: '#/channels/rooms'
    title: 프론트엔드 → 백엔드 (방장이 보내는 것)
    description: 채팅 메시지를 보냅니다. 상대가 아직 없으면 error 가 돌아옵니다.
    messages:
      - $ref: '#/channels/rooms/messages/chatIn'

  sendJoined:
    action: send
    channel:
      $ref: '#/channels/join'
    title: 백엔드 → 프론트엔드 (들어간 사람이 받는 것)
    description: 들어가는 데 성공했는지 알려주고, 방장이 나가면 그것도 알려줍니다.
    messages:
      - $ref: '#/channels/join/messages/joined'
      - $ref: '#/channels/join/messages/hostLeft'
      - $ref: '#/channels/join/messages/chatOut'
      - $ref: '#/channels/join/messages/joinError'

  sendMatched:
    action: send
    channel:
      $ref: '#/channels/match'
    title: 백엔드 → 프론트엔드 (매칭)
    description: |
      줄을 섰는지 짝이 지어졌는지 알려주고, 그 뒤로는 채팅 메시지가 옵니다.
    messages:
      - $ref: '#/channels/match/messages/waiting'
      - $ref: '#/channels/match/messages/matched'
      - $ref: '#/channels/match/messages/partnerLeft'
      - $ref: '#/channels/match/messages/chatOut'
      - $ref: '#/channels/match/messages/roomError'

  receiveChatFromMatched:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: 프론트엔드 → 백엔드 (매칭)
    description: 코드로 만났을 때와 **완전히 같은 형식**입니다.
    messages:
      - $ref: '#/channels/match/messages/chatIn'

  receiveChatFromGuest:
    action: receive
    channel:
      $ref: '#/channels/join'
    title: 프론트엔드 → 백엔드 (들어간 사람이 보내는 것)
    description: 방장이 보내는 것과 **완전히 같은 형식**입니다.
    messages:
      - $ref: '#/channels/join/messages/chatIn'

components:
  messages:
    connected:
      name: connected
      title: 연결 완료
      summary: 접속 직후 서버가 **먼저** 보냅니다. (1회)
      description: |
        프론트엔드는 이걸 받아야 "연결 완료"를 확신할 수 있습니다.
        연결 상태 표시등을 켜는 시점으로 쓰세요.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: connected
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 안내 문구
      examples:
        - name: 연결 직후
          payload:
            type: connected
            message: 웹소켓 연결됨

    echo:
      name: echo
      title: 메아리 (임시)
      summary: 내가 보낸 문자열을 그대로 돌려줍니다.
      description: |
        ⚠️ **임시 기능입니다.** "선이 진짜 양방향으로 통하는지" 눈으로
        확인하는 용도라, 실제 기능이 붙으면 사라집니다.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: echo
            description: 메시지 종류
          message:
            type: string
            description: 내가 보낸 문자열 그대로
      examples:
        - name: "'안녕' 을 보냈을 때"
          payload:
            type: echo
            message: 안녕

    roomCreated:
      name: room_created
      title: 방이 만들어짐
      summary: 접속 직후 **바로** 옵니다. 여기 담긴 `code` 를 친구에게 알려주세요.
      description: |
        이걸 받은 뒤에는 **연결을 끊지 마세요.** 연결이 살아 있는 동안만
        친구가 그 코드로 들어올 수 있습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, code, name, host_nickname, max_players]
        properties:
          type:
            type: string
            const: room_created
            description: 메시지 종류
          code:
            type: string
            description: |
              초대 코드. 대문자·숫자 6자리이며 `O` `I` `L` `0` `1` 은 나오지 않습니다.
              (불러줄 때 헷갈리지 않게 하려고 뺐습니다)
          name:
            type: string
            description: 자동으로 지어진 방 이름 (`OO님의 방`)
          host_nickname:
            type: string
            description: 방장 닉네임 (앞뒤 공백이 정리된 최종 값)
          max_players:
            type: integer
            description: 정원. 지금은 항상 4
      examples:
        - name: 수진님이 방을 만들었을 때
          payload:
            type: room_created
            code: DQDZ3Z
            name: 수진님의 방
            host_nickname: 수진
            max_players: 4

    waiting:
      name: waiting
      title: 줄을 섰음
      summary: 지금 기다리는 사람이 없어서 **줄을 선 상태**입니다.
      description: |
        연결을 그대로 두고 기다리세요. 다음 사람이 오면 `matched` 가 옵니다.

        화면에는 "상대를 찾는 중…" 같은 안내를 띄우면 됩니다.
      contentType: application/json
      payload:
        type: object
        required: [type, position, nickname]
        properties:
          type:
            type: string
            const: waiting
            description: 메시지 종류
          position:
            type: integer
            description: |
              줄에서 내 순번. `1` 이면 다음에 오는 사람과 바로 짝이 됩니다.
              1:1 이라 사람이 오는 즉시 짝이 지어지므로 보통 항상 `1` 입니다.
          nickname:
            type: string
            description: 내 닉네임 (앞뒤 공백이 정리된 최종 값)
      examples:
        - name: 아무도 없어서 기다리게 됨
          payload:
            type: waiting
            position: 1
            nickname: 엘리

    matched:
      name: matched
      title: 짝이 지어짐
      summary: 상대를 만났습니다. 이제 채팅할 수 있습니다.
      description: |
        **두 사람 모두에게** 갑니다. 기다리던 사람에게는 **요청하지도
        않았는데** 오는 소식입니다 — 이 기능을 웹소켓으로 만든 이유입니다.

        먼저 기다린 사람이 방장이 되지만, 채팅에서 방장과 손님이 하는 일은
        **똑같습니다.** 화면에서 구분해 보여줄 필요가 없습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, code, partner_nickname]
        properties:
          type:
            type: string
            const: matched
            description: 메시지 종류
          code:
            type: string
            description: |
              만들어진 방의 코드. 랜덤 매칭에서는 **쓸 일이 없습니다.**
              (누구에게 알려줄 코드가 아닙니다) 문제가 생겼을 때
              어느 방이었는지 찾는 용도로만 참고하세요.
          partner_nickname:
            type: string
            description: 상대의 닉네임. 화면에 "OO님과의 대화"처럼 띄우세요
      examples:
        - name: 엘리와 짝이 되었을 때
          payload:
            type: matched
            code: UG59N9
            partner_nickname: 엘리

    partnerLeft:
      name: partner_left
      title: 상대가 나감
      summary: 대화하던 상대가 연결을 끊었습니다.
      description: |
        1:1 이라 상대가 나가면 대화가 성립하지 않습니다. 이 메시지를 받은
        **직후 연결도 함께 닫힙니다.** (닫는 코드 `1001`)

        다시 하려면 `/ws/match` 에 **새로 접속**하세요. 그러면 다시 줄을 섭니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: partner_left
            description: 메시지 종류
          nickname:
            type: string
            description: 나간 사람의 닉네임
      examples:
        - name: 엘리가 나갔을 때
          payload:
            type: partner_left
            nickname: 엘리

    chatIn:
      name: message (보내는 쪽)
      title: 채팅 메시지 보내기
      summary: 상대에게 할 말을 보냅니다. **방장·친구 모두 같은 형식**입니다.
      description: |
        문자열이 아니라 **JSON 으로** 보내야 합니다.

        ```javascript
        ws.send(JSON.stringify({ type: "message", text: "안녕" }));
        ```

        앞뒤 공백은 서버가 정리합니다. 규칙에 안 맞으면 `error` 가 돌아오지만
        **연결은 끊기지 않습니다.** 고쳐서 다시 보내면 됩니다.
      contentType: application/json
      payload:
        type: object
        required: [type, text]
        properties:
          type:
            type: string
            const: message
            description: 메시지 종류. 지금은 이것 하나뿐입니다
          text:
            type: string
            description: 할 말. 공백 제거 후 1~500자
      examples:
        - name: 인사 보내기
          payload:
            type: message
            text: 안녕

    chatOut:
      name: message (받는 쪽)
      title: 채팅 메시지 받기
      summary: 상대가 보낸 말이 도착했습니다.
      description: |
        ⚠️ **내가 보낸 말은 나에게 되돌아오지 않습니다.** 내 말은 내 화면에
        바로 그리세요. 되돌려 주면 같은 말이 두 번 그려지기 쉽습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, from, text, at]
        properties:
          type:
            type: string
            const: message
            description: 메시지 종류
          from:
            type: string
            description: 보낸 사람의 닉네임
          text:
            type: string
            description: 보낸 내용 (앞뒤 공백이 정리된 값)
          at:
            type: string
            description: |
              서버가 찍은 시각 (ISO 8601). **각자 컴퓨터의 시계가 아니라
              서버 시계**입니다. 그래야 두 사람 화면에서 순서가 같습니다.
      examples:
        - name: 수진님이 보낸 말
          payload:
            type: message
            from: 수진
            text: 안녕 엘리
            at: '2026-08-08T13:22:38.694059'

    guestJoined:
      name: guest_joined
      title: 친구가 들어옴
      summary: 친구가 코드를 치고 들어왔을 때 **방장에게** 옵니다.
      description: |
        **방장이 요청하지 않았는데 오는 메시지입니다.** 이 기능을 웹소켓으로
        만든 이유가 바로 이것입니다. HTTP 였다면 방장이 "혹시 들어왔나요?"를
        계속 물어봐야 했습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: guest_joined
            description: 메시지 종류
          nickname:
            type: string
            description: 들어온 사람의 닉네임
      examples:
        - name: 엘리가 들어왔을 때
          payload:
            type: guest_joined
            nickname: 엘리

    guestLeft:
      name: guest_left
      title: 친구가 나감
      summary: 들어와 있던 친구가 연결을 끊었을 때 **방장에게** 옵니다.
      description: |
        자리가 다시 비므로, **같은 코드로 다른 사람이 들어올 수 있습니다.**
        방장의 연결은 그대로 살아 있습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, nickname]
        properties:
          type:
            type: string
            const: guest_left
            description: 메시지 종류
          nickname:
            type: string
            description: 나간 사람의 닉네임
      examples:
        - name: 엘리가 나갔을 때
          payload:
            type: guest_left
            nickname: 엘리

    joined:
      name: joined
      title: 방에 들어감
      summary: 코드가 맞고 자리가 있으면 **바로** 옵니다.
      description: |
        이걸 받으면 두 명이 다 모인 것입니다. 연결을 끊지 마세요.
      contentType: application/json
      payload:
        type: object
        required: [type, code, host_nickname, guest_nickname]
        properties:
          type:
            type: string
            const: joined
            description: 메시지 종류
          code:
            type: string
            description: 들어간 방의 코드 (대문자로 맞춰진 값)
          host_nickname:
            type: string
            description: 방장 닉네임. 화면에 "OO님과의 대화"처럼 띄우는 데 씁니다
          guest_nickname:
            type: string
            description: 내 닉네임 (앞뒤 공백이 정리된 최종 값)
      examples:
        - name: 엘리가 수진님의 방에 들어갔을 때
          payload:
            type: joined
            code: DQDZ3Z
            host_nickname: 수진
            guest_nickname: 엘리

    hostLeft:
      name: host_left
      title: 방장이 나감
      summary: 방장이 연결을 끊었을 때 **들어와 있던 사람에게** 옵니다.
      description: |
        1:1 대화라 방장이 나가면 대화가 성립하지 않습니다. 이 메시지를
        받은 **직후 연결도 함께 닫힙니다.** (닫는 코드 `1001`)

        그 코드는 이제 죽었습니다. 다시 들어가려면 **새 코드를 받아야** 합니다.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: host_left
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 안내 문구
      examples:
        - name: 방장이 탭을 닫았을 때
          payload:
            type: host_left
            message: 방장이 나갔습니다

    joinError:
      name: error
      title: 들어가지 못함
      summary: 코드가 틀렸거나 자리가 없을 때 옵니다. 보낸 뒤 연결이 끊깁니다.
      description: |
        이 메시지를 받으면 **곧 연결이 끊깁니다.** (끊는 코드 `1008`)

        `message` 로 오는 것들:

        - `그런 방이 없습니다. 코드를 다시 확인해 주세요`
          — 없는 코드이거나, 방장이 이미 나간 코드입니다.
          **두 경우를 구분해서 알려주지 않습니다.** 친구가 할 수 있는 일은
          어느 쪽이든 똑같고(코드를 다시 받기), 구분해 주면 아무 코드나
          넣어보며 "이 코드는 있었네"를 알아내는 데 쓰일 수 있습니다.
        - `방이 꽉 찼습니다` — 이미 두 명이 모여 있습니다.
        - 닉네임 규칙 위반 메시지 — 방 만들 때와 같습니다.
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: error
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 이유
      examples:
        - name: 없는 코드
          payload:
            type: error
            message: 그런 방이 없습니다. 코드를 다시 확인해 주세요
        - name: 자리가 없음
          payload:
            type: error
            message: 방이 꽉 찼습니다

    roomError:
      name: error
      title: 잘못됐거나 아직 안 되는 일
      summary: 닉네임이 규칙에 안 맞거나, 아직 없는 기능을 쓰려 할 때 옵니다.
      description: |
        **닉네임이 잘못된 경우** — 이 메시지를 보낸 뒤 서버가 연결을 끊습니다.
        (끊는 코드 `1008` = "규칙에 안 맞아서 끊음")

        **채팅 메시지가 규칙에 안 맞는 경우** — 연결은 그대로 두고 이유만
        보냅니다. 고쳐서 다시 보내면 됩니다. 조용히 무시하면 프론트엔드가
        메시지가 갔다고 착각하기 때문에 일부러 알려줍니다.

        `message` 로 오는 것들:

        - `상대가 아직 들어오지 않았습니다` — 혼자 있을 때 보냈습니다.
        - `JSON 으로 보내주세요...` — 그냥 문자열을 보냈습니다.
        - `{"type":"message","text":"..."} 형식으로 보내주세요` — 모르는 종류입니다.
        - `빈 메시지는 보낼 수 없습니다` / `메시지는 500자 이하여야 합니다`
      contentType: application/json
      payload:
        type: object
        required: [type, message]
        properties:
          type:
            type: string
            const: error
            description: 메시지 종류
          message:
            type: string
            description: 사람이 읽는 이유
      examples:
        - name: 닉네임이 비었을 때 (곧 끊김)
          payload:
            type: error
            message: 닉네임은 비어 있을 수 없습니다
        - name: 혼자 있을 때 말을 걸었을 때 (안 끊김)
          payload:
            type: error
            message: 상대가 아직 들어오지 않았습니다

    clientText:
      name: clientText
      title: 아무 문자열
      summary: 형식 없음. 아무 문자열이나 보내면 됩니다.
      description: |
        지금은 연결 확인용이라 형식이 없습니다.
        실제 기능이 붙으면 `{"type": "...", ...}` 형태의 JSON 으로 바뀝니다.
      contentType: text/plain
      payload:
        type: string
      examples:
        - name: 아무 말
          payload: 안녕

# ─────────────────────────────────────────────────────────────
# 아직 없는 것 (중요)
#
# 지금은 통로만 있습니다. 아래는 하나도 구현돼 있지 않습니다.
#   - 여러 사람에게 동시에 알리기 (한 명이 보낸 걸 다른 사람들이 받는 것)
#   - 방 구분 (누가 어느 방에 있는지)
#   - 누가 연결했는지 식별 (닉네임·플레이어 id)
#   - 연결이 끊긴 사람 정리
#
# 두 명이 각각 접속해도 서로의 메시지는 보이지 않고, 각자 자기 메아리만
# 받습니다. 위 항목들은 각각 별도 기능 단위로 진행합니다.
#
# 연결이 끊기는 경우:
#   - 브라우저 탭을 닫음        → 정상 종료
#   - 서버를 껐다 켬 (--reload) → 끊김. 자동 재연결 안 됨
#   - 네트워크 끊김             → 끊김
#   끊기면 프론트엔드가 직접 다시 연결해야 합니다. (ws.onclose)
# ─────────────────────────────────────────────────────────────
x-not-implemented-yet:
  - 지난 대화 내용 저장 — **새로고침하면 대화가 전부 사라집니다**
  - 상대가 읽었는지 표시 (읽음 확인)
  - 상대가 입력 중인지 표시
  - 방장과 친구가 **같은 닉네임**이어도 막지 않음 (대화가 헷갈릴 수 있음)
  - 끊긴 뒤 같은 방으로 다시 들어가기 (재접속)

x-disconnect:
  - 상황: 방장이 나감
    결과: 들어와 있던 친구는 host_left 를 받고 **함께 끊깁니다(1001).** 방은 finished 가 되어 그 코드는 영영 죽습니다.
  - 상황: 들어와 있던 친구가 나감
    결과: 방장에게 guest_left 가 갑니다. 방은 다시 waiting 이 되어 **같은 코드로 다른 사람이 들어올 수 있습니다.**
  - 상황: (랜덤 매칭) 짝지어진 상대가 나감
    결과: partner_left 를 받고 **함께 끊깁니다(1001).** 다시 하려면 /ws/match 에 새로 접속하세요.
  - 상황: (랜덤 매칭) 줄 서서 기다리는 중에 나감
    결과: 조용히 줄에서 빠집니다. 아무에게도 영향이 없습니다.
  - 상황: 서버를 껐다 켬 (--reload 포함)
    결과: 모든 연결이 끊기고, 살아 있던 방은 전부 무효가 됩니다.
  - 상황: 네트워크가 끊김
    결과: 그 사람이 스스로 나간 것과 같게 처리됩니다.
  - 상황: 닉네임이 규칙에 안 맞거나 코드가 틀림
    결과: error 메시지를 받은 뒤 코드 1008 로 끊깁니다. 방은 만들어지지도, 들어가지지도 않습니다.
